<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Авторизация</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent1: #7b8cff;
      --accent2: #4b2aff;
      --radius: 20px;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #8b9eff 0%, #a78bfa 50%, #c084fc 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #111;
      overflow-x: hidden;
    }

    /* Слой блюра */
    .blur-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.15);
      z-index: 0;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      overflow: hidden;
      z-index: 1;
      position: relative;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Верхняя панель (меню) */
    .menu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(255,255,255,0.3);
    }

    .menu-item {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      transition: 0.2s;
    }
    .menu-item:hover {
      color: var(--accent2);
    }

    .top {
      background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.4) 100%);
      padding: 30px 24px 24px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      background: rgba(123,140,255,0.15);
      color: var(--accent2);
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      margin: 0;
      color: #222;
    }

    .form {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form h2 {
      font-size: 18px;
      margin: 0 0 4px;
      font-weight: 700;
    }

    .form p {
      color: #555;
      font-size: 14px;
      margin: 0 0 16px;
    }

    .input {
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      width: 100%;
      outline: none;
    }
    .input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(123,140,255,0.25);
    }

    .forgot {
      text-align: right;
      font-size: 13px;
      color: #555;
      text-decoration: none;
      margin-top: -8px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--accent2), var(--accent1));
      color: white;
      box-shadow: 0 6px 18px rgba(75,42,255,0.3);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.5);
      color: #222;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .bottom-link {
      text-align: center;
      font-size: 14px;
      color: var(--accent2);
      font-weight: 600;
      text-decoration: none;
      margin-top: 12px;
      display: inline-block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.3s; }
  </style>
</head>
<body>
  <div class="blur-bg"></div>

  <div class="card">
    <div class="menu">
      <div class="menu-item">Главная</div>
      <div class="menu-item">О нас</div>
      <div class="menu-item">Поддержка</div>
    </div>

    <div class="top">
      <div class="tag">АВТОРИЗАЦИЯ</div>
      <div class="title">Рады видеть именно тебя</div>
    </div>

    <div class="form">
      <h2>Вход</h2>
      <p>Введите свои данные, чтобы продолжить.</p>

      <input type="text" id="login" class="input" placeholder="Логин">
      <input type="password" id="password" class="input" placeholder="Пароль">
      <a href="#" class="forgot">Забыли пароль?</a>

      <button class="btn btn-primary" id="btnLogin">Войти</button>
      <button class="btn btn-secondary" id="btnCreate">Создать аккаунт</button>

      <a href="#" class="bottom-link">Приобрести подписку</a>
    </div>
  </div>

  <script>
    const login = document.getElementById('login');
    const password = document.getElementById('password');
    const btnLogin = document.getElementById('btnLogin');

    btnLogin.addEventListener('click', () => {
      if (!login.value.trim() || !password.value.trim()) {
        (login.value.trim() ? password : login).classList.add('shake');
        setTimeout(() => {
          login.classList.remove('shake');
          password.classList.remove('shake');
        }, 300);
        alert('Введите логин и пароль.');
        return;
      }
      btnLogin.textContent = 'Вход...';
      btnLogin.disabled = true;
      setTimeout(() => {
        btnLogin.textContent = 'Войти';
        btnLogin.disabled = false;
        alert('Вход выполнен (демо).');
      }, 800);
    });

    document.getElementById('btnCreate').addEventListener('click', () => {
      alert('Открытие регистрации (демо).');
    });
  </script>
</body>
</html>
