<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Авторизация</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
@font-face {
  font-family: 'Benzin';
  src: url('https://github.com/wretone10-del/Dick/releases/download/sht/benzin-bold.otf') format('opentype');
  font-weight: bold;
  font-style: normal;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Benzin',sans-serif;transition:all 0.3s}
body{
  background:#121212;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:#fff;
}

.background-box{
  position:relative;
  width:100%;
  max-width:420px;
  border-radius:25px;
  overflow:hidden;
  z-index:1;
  background: linear-gradient(135deg, #1c1c1c 0%, #2a2a2a 100%);
  transition: all 0.3s;
}

.background-gradient{
  position:absolute;
  inset:0;
  background: transparent;
  z-index:0;
}

.container{
  position:relative;
  backdrop-filter:blur(25px);
  border-radius:25px;
  overflow:hidden;
  z-index:1;
  box-shadow:0 6px 40px rgba(60,79,224,0.5);
  animation:scaleIn .8s ease;
  padding-bottom:20px;
}

@keyframes scaleIn{0%{opacity:0;transform:translateY(30px) scale(.98)}60%{opacity:1;transform:translateY(-5px) scale(1.02)}100%{transform:translateY(0) scale(1)}}

.theme-toggle{
  position:absolute;
  top:20px;
  right:20px;
  cursor:pointer;
  font-size:20px;
  color:#fff;
  background:rgba(255,255,255,0.1);
  padding:8px 12px;
  border-radius:50%;
  transition:all 0.3s;
}

.left{padding:30px;text-align:left}
.badge{background:rgba(255,255,255,.1);color:#6e80ff;font-size:12px;padding:5px 10px;border-radius:8px;display:inline-block;margin-bottom:20px;backdrop-filter:blur(10px)}
.left h1{font-size:24px;font-weight:600;color:#fff;margin-bottom:20px}

.tabs{display:flex;justify-content:space-around;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);padding:10px;border-radius:15px;margin:0 20px 20px 20px}
.tab{flex:1;text-align:center;color:#6e80ff;padding:10px 0;border-radius:10px;cursor:pointer;transition:.3s}
.tab.active{background:rgba(110,128,255,.2);color:#6e80ff;font-weight:600}

.right{padding:20px 30px 30px 30px;display:none}
.right.active{display:block}
.right h2{font-size:20px;font-weight:600;margin-bottom:10px;color:#fff}
.right p{font-size:14px;color:#ccc;margin-bottom:20px}

.input-group{margin-bottom:15px;position:relative}
.input-group input{width:100%;padding:12px 40px;font-size:14px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.1);color:#fff;outline:none;transition:.3s}
.input-group input:focus{border-color:#6e80ff;background:rgba(255,255,255,.15)}
.input-group i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.5)}

.btn{width:100%;padding:12px;background:linear-gradient(90deg,#3c4fe0 0%,#8a96ff 100%);color:white;font-size:15px;border:none;border-radius:10px;cursor:pointer;transition:all .3s;margin-top:10px;display:block;text-align:center;}
.btn:hover{transform:scale(1.03);box-shadow:0 5px 15px rgba(60,79,224,.5)}

#downloadBtn{width:100%; margin:10px 0; padding:12px}

@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.error-shake{animation:shake .4s ease}
.error-text{color:#e63946;font-size:13px;margin-top:-10px;margin-bottom:15px;display:none}
.error-text.active{display:block}

.rain{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.drop{position:absolute;width:2px;height:15px;background:rgba(110,128,255,.18);bottom:100%;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(110vh)}}

/* Светлая тема */
body.light{
  background:#f0f0f0;
  color:#1e1e1e;
}
body.light .background-box{
  background: linear-gradient(135deg,#a8d4ff 0%,#80bfff 100%);
}
body.light .container{
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(230,240,255,0.95));
  border:1px solid rgba(60,79,224,0.3);
  box-shadow:0 6px 50px rgba(60,79,224,0.15);
}
body.light .left h1, body.light .right h2, body.light .right p{color:#1e1e1e}
body.light .input-group input{
  background: rgba(255,255,255,0.7);
  color:#1e1e1e;
  border:1px solid rgba(0,0,0,.1)
}
body.light .input-group input:focus{
  background: rgba(255,255,255,0.9)
}
/* Иконки черные в светлой теме */
body.light .input-group i {
  color: #1e1e1e;
}
body.light .tab.active{
  background: linear-gradient(90deg,#3c4fe0 0%,#6e80ff 100%);
  color:#fff;
}
body.light .theme-toggle i{color:#1e1e1e}
</style>
</head>
<body>
<div class="rain" id="rain"></div>

<div class="background-box" id="authScreen">
  <div class="background-gradient"></div>

  <div class="container" id="formBox">
    <div class="theme-toggle" id="themeToggle"><i class="fa fa-moon"></i></div>

    <div class="left">
      <div class="badge">АВТОРИЗАЦИЯ</div>
      <h1>Рады видеть<br>именно тебя</h1>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Войти</div>
      <div class="tab" onclick="switchTab('register')">Зарегистрироваться</div>
    </div>

    <div class="right active" id="login">
      <h2>Вход в аккаунт</h2>
      <p>Авторизуйтесь, чтобы продолжить.</p>
      <div class="input-group">
        <i class="fa fa-envelope"></i>
        <input id="loginEmail" type="email" placeholder="Email"/>
      </div>
      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input id="loginPassword" type="password" placeholder="Пароль"/>
      </div>
      <div class="error-text" id="loginError"></div>

      <button class="btn" id="loginBtn">Войти</button>
      <button class="btn" id="downloadBtn">Скачать программу</button>
    </div>

    <div class="right" id="register">
      <h2>Создать аккаунт</h2>
      <p>Заполните поля, чтобы зарегистрироваться.</p>
      <div class="input-group">
        <i class="fa fa-envelope"></i>
        <input id="registerEmail" type="email" placeholder="Email"/>
      </div>
      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input id="registerPassword" type="password" placeholder="Пароль"/>
      </div>
      <div class="error-text" id="registerError"></div>
      <button class="btn" id="registerBtn">Зарегистрироваться</button>
    </div>
  </div>
</div>

<script>
const tabs=document.querySelectorAll('.tab');
const panels=document.querySelectorAll('.right');
function switchTab(tab){
  tabs.forEach(t=>t.classList.remove('active'));
  panels.forEach(p=>p.classList.remove('active'));
  document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById(tab).classList.add('active');
}

const rain=document.getElementById('rain');
for(let i=0;i<60;i++){
  const drop=document.createElement('div');
  drop.className='drop';
  drop.style.left=(Math.random()*100)+'%';
  drop.style.animationDuration=(0.9+Math.random()*1.2)+'s';
  drop.style.animationDelay=(Math.random()*2)+'s';
  drop.style.height=(8+Math.random()*18)+'px';
  rain.appendChild(drop);
}

const themeToggle=document.getElementById('themeToggle');
themeToggle.addEventListener('click',()=>{
  document.body.classList.toggle('light');
  const icon=themeToggle.querySelector('i');
  if(document.body.classList.contains('light')){
    icon.classList.remove('fa-moon');
    icon.classList.add('fa-sun');
  }else{
    icon.classList.remove('fa-sun');
    icon.classList.add('fa-moon');
  }
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyBnsAfr4vNj-Bo5-c4_WKjo4jIaqQrTse0",
  authDomain:"auth-bf4ed.firebaseapp.com",
  projectId:"auth-bf4ed",
  storageBucket:"auth-bf4ed.firebasestorage.app",
  messagingSenderId:"225135779305",
  appId:"1:225135779305:web:6b99454979b61a685d3f78",
  measurementId:"G-KXKXV54JFM"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const loginBtn=document.getElementById('loginBtn');
const registerBtn=document.getElementById('registerBtn');
const downloadBtn=document.getElementById('downloadBtn');
const loginError=document.getElementById('loginError');
const registerError=document.getElementById('registerError');
const formBox=document.getElementById('formBox');

let userLoggedIn=false;

loginBtn.addEventListener('click',async()=>{
  const email=document.getElementById('loginEmail').value;
  const password=document.getElementById('loginPassword').value;
  loginError.classList.remove('active');
  formBox.classList.remove('error-shake');
  try{
    await signInWithEmailAndPassword(auth,email,password);
    userLoggedIn=true;
    alert('✅ Вход успешен!');
  }catch(error){
    console.error('login error',error);
    loginError.textContent='❌ Неверный логин или пароль';
    loginError.classList.add('active');
    formBox.classList.add('error-shake');
    setTimeout(()=>formBox.classList.remove('error-shake'),500);
  }
});

registerBtn.addEventListener('click',async()=>{
  const email=document.getElementById('registerEmail').value;
  const password=document.getElementById('registerPassword').value;
  registerError.classList.remove('active');
  formBox.classList.remove('error-shake');
  try{
    await createUserWithEmailAndPassword(auth,email,password);
    userLoggedIn=true;
    alert('✅ Регистрация успешна!');
  }catch(error){
    console.error('register error',error);
    registerError.textContent='❌ '+(error && error.message? error.message:'Ошибка регистрации');
    registerError.classList.add('active');
    formBox.classList.add('error-shake');
    setTimeout(()=>formBox.classList.remove('error-shake'),500);
  }
});

downloadBtn.addEventListener('click',()=>{
  if(!userLoggedIn){
    alert('❌ Сначала зарегистрируйтесь или войдите');
    return;
  }
  const programUrl='https://github.com/wretone10-del/Dick/releases/download/sht/benzin-bold.otf';
  const programName='benzin-bold.otf';
  const link=document.createElement('a');
  link.href=programUrl;
  link.download=programName;
  link.click();
});
</script>
</body>
</html>
